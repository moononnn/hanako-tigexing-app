<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提个醒 · 导航</title>
  <style>
    :root {
      color-scheme: light;
      --paper: var(--bg, #f5f8f3);
      --surface: var(--card, #fffdf8);
      --ink: var(--text, #35493e);
      --muted: var(--text-muted, #718077);
      --mint: rgba(93, 174, 142, .14);
      --mint-deep: #4A9277;
      --line: rgba(93, 122, 107, .16);
      font-family: "霞鹜文楷", "LXGW WenKai", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    html[data-appearance="dark"] {
      color-scheme: dark;
      --paper: var(--bg, #202923);
      --surface: var(--card, #2b362f);
      --ink: var(--text, #ecf2eb);
      --muted: var(--text-muted, #b1bcb3);
      --mint: rgba(120, 200, 168, .18);
      --mint-deep: #a5d0b5;
      --line: rgba(180, 210, 190, .16);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      padding: 14px 10px 12px;
      background: var(--paper);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.6;
      overflow-y: auto;
    }
    .brand { display: flex; align-items: center; gap: 8px; padding: 0 8px 12px; }
    .mark {
      width: 34px; height: 34px; flex: 0 0 auto; border-radius: 11px;
      background: var(--mint); color: var(--mint-deep);
      display: grid; place-items: center; font-size: 15px;
    }
    .name { font-size: 14px; font-weight: 600; line-height: 1.3; }
    .sub { font-size: 9.5px; color: var(--muted); letter-spacing: .12em; }

    .group { margin-bottom: 8px; }
    .label {
      padding: 0 9px 4px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .14em;
      color: var(--muted);
      opacity: .7;
    }
    button {
      display: flex; align-items: center; gap: 8px;
      width: 100%; margin-bottom: 2px; padding: 7px 9px;
      border: 0; border-radius: 9px;
      background: transparent; color: var(--ink);
      font: inherit; font-size: 12.8px; text-align: left;
      cursor: pointer; transition: background .15s ease, color .15s ease;
    }
    button svg { flex: 0 0 auto; opacity: .55; }
    button:hover { background: var(--mint); }
    button[aria-current="page"] {
      background: var(--surface);
      color: var(--mint-deep);
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(66, 86, 65, .08);
    }
    button[aria-current="page"] svg { opacity: .95; }
    .foot {
      margin-top: auto; padding: 10px 8px 2px; border-top: 1px solid var(--line);
      font-size: 10.5px; color: var(--muted); letter-spacing: .04em;
    }

    @media (max-width: 520px) {
      body { padding: 10px 8px; }
      .brand { padding-bottom: 8px; }
      .label { display: none; }
      .group { margin-bottom: 4px; }
      .foot { display: none; }
    }
  </style>
</head>
<body>
  <div class="brand">
    <div class="mark" aria-hidden="true">醒</div>
    <div>
      <div class="name">提个醒</div>
      <div class="sub">SETTINGS</div>
    </div>
  </div>

  <div class="group">
    <div class="label">设置</div>

    <button type="button" data-pane="notify" aria-current="page">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="5.6"/><path d="M8 5.2V8l2 1.4" stroke-linecap="round"/></svg>
      <span>提醒时机</span>
    </button>

    <button type="button" data-pane="sound">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 6.4v3.2h2.2L8.6 12V4L5.2 6.4H3Z" stroke-linejoin="round"/><path d="M10.6 6.2a2.8 2.8 0 0 1 0 3.6" stroke-linecap="round"/></svg>
      <span>谁的声音</span>
    </button>

    <button type="button" data-pane="copy">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M11.2 2.6 13.4 4.8 5.6 12.6l-3 .8.8-3z" stroke-linejoin="round"/></svg>
      <span>怎么说</span>
    </button>

    <button type="button" data-pane="quiet">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12.6 9.6A5.2 5.2 0 0 1 6.4 3.4 5.4 5.4 0 1 0 12.6 9.6Z" stroke-linejoin="round"/></svg>
      <span>别吵我</span>
    </button>
  </div>

  <div class="group">
    <div class="label">其他</div>
    <button type="button" data-pane="about">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="5.6"/><path d="M8 7.2v3.4M8 5.4v.5" stroke-linecap="round"/></svg>
      <span>关于提个醒</span>
    </button>
  </div>

  <div class="foot">moononnn &amp; 小花</div>

  <script type="module">
    // 用 Hana 官方 UI SDK（从 hana-app-sdk.tgz 的 dist/ui.js 拷来，自包含 ESM）。
    // 原来那份 ./assets/sdk.js 是设置页自用的 shim，只有 hana.api.fetch，没导出、也没有 ready。
    import { hana } from './assets/app-sdk.js';

    // 宿主靠 hana.ready() 这个报到决定面板算不算加载成功。
    // 不调它，宿主会一直等到超时，然后显示「应用加载失败」（实机：知意同款做法）。
    hana.ready();

    // 这块面板挂在 Hana 的功能面板里（manifest 的 functionPanel），
    // 点了只负责把「该显示哪一屏」广播出去；真正的页面在 settings.html。
    const KEY = 'tigexingPane';
    const CHANNEL = 'tigexing-panel-view';
    const buttons = [...document.querySelectorAll('button[data-pane]')];
    const channel = ('BroadcastChannel' in window) ? new BroadcastChannel(CHANNEL) : null;

    function paint(pane) {
      for (const button of buttons) {
        button.setAttribute('aria-current', button.dataset.pane === pane ? 'page' : 'false');
      }
    }

    function pick(pane) {
      paint(pane);
      try { localStorage.setItem(KEY, pane); } catch {}
      channel?.postMessage({ pane, from: 'nav' });
      // BroadcastChannel 被宿主裁掉时，靠 postMessage 兜底
      window.parent?.postMessage({ type: 'tigexing-pane', pane }, '*');
    }

    for (const button of buttons) {
      button.addEventListener('click', () => pick(button.dataset.pane));
    }

    // 主页面自己也会广播回来（比如记住上次那一屏），保持两边一致
    channel?.addEventListener('message', (event) => {
      if (event.data?.from === 'page' && typeof event.data.pane === 'string') paint(event.data.pane);
    });

    window.addEventListener('message', (event) => {
      if (event.data?.type === 'tigexing-pane-state' && typeof event.data.pane === 'string') {
        paint(event.data.pane);
      }
    });

    let remembered = '';
    try { remembered = localStorage.getItem(KEY) || ''; } catch {}
    if (remembered && buttons.some((b) => b.dataset.pane === remembered)) paint(remembered);
  </script>
</body>
</html>
